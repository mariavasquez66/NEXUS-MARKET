# Application Name & Server
spring.application.name=nexusmarket
server.port=8080

# MySQL Configuration (Relational Persistence - Spring Data JPA)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:nexus_app}
spring.datasource.password=${DB_PASSWORD:nexuspassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (NoSQL Audit Logging - Spring Data MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
